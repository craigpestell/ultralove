# Throttle known expensive WooCommerce and plugin endpoints by client IP.
# Empty map keys are ignored by limit_req_zone, so only matched arguments are limited.
map $arg_wc-ajax $wc_ajax_limit_key {
    default "";
    martfury_search_products $binary_remote_addr;
    mf_elementor_get_elements $binary_remote_addr;
    martfury_footer_recently_viewed $binary_remote_addr;
}

map $arg_add_to_wishlist $wishlist_limit_key {
    default "";
    ~^[0-9]+$ $binary_remote_addr;
}

limit_req_zone $binary_remote_addr zone=cloudinary_queue_perip:10m rate=1r/s;
limit_req_zone $wc_ajax_limit_key zone=wc_ajax_hot_perip:10m rate=2r/s;
limit_req_zone $wishlist_limit_key zone=wishlist_hot_perip:10m rate=1r/s;
