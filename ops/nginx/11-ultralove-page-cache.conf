# FastCGI page cache for anonymous HTML, installed as /etc/nginx/conf.d/11-ultralove-page-cache.conf.
# Used by the `location ~ \.php$` block in ultralove.ca.conf. Cloudflare APO already caches plain anonymous
# paths; this catches what it skips (query-string URLs such as ?orderby= and ?product_brand=, crawlers, APO misses)
# so those requests don't run PHP and the Cloudinary output-buffer rewrite.
#
# Needs `mkdir -p /var/cache/nginx` first (nginx creates only the last path component).
# Purge by emptying the directory: `find /var/cache/nginx/ultralove -type f -delete` (deploy.sh does this).

fastcgi_cache_path /var/cache/nginx/ultralove levels=1:2 keys_zone=ultralove:32m max_size=256m inactive=30m use_temp_path=off;

# 1 = never read from or store in the cache. The string matched is
# "METHOD|request-uri|cookies"; one place to list every request that must reach PHP.
map "$request_method|$request_uri|$http_cookie" $ultralove_skip_cache {
    default 0;

    # Only GET and HEAD are cached.
    "~^(?!GET\||HEAD\|)" 1;

    # Dynamic endpoints and anything that changes state through the query string.
    "~^[^|]*\|[^|]*(wc-ajax|admin-ajax|add-to-cart|add_to_wishlist|remove_from_wishlist|removed_item|wp-json|wp-cron|wp-login|wp-admin|_wpnonce|preview=)" 1;

    # Per-visitor pages.
    "~^[^|]*\|/(cart|checkout|my-account)(/|\?|\||$)" 1;

    # Visitors with a login, cart, wishlist session, password-protected post or comment identity.
    "~\|[^|]*(wordpress_logged_in_|wordpress_sec_|wp-postpass_|comment_author|woocommerce_items_in_cart|woocommerce_cart_hash|wp_woocommerce_session_|yith_wcwl_session_)" 1;
}
