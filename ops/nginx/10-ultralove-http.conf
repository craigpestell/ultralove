# http-level tuning from the production droplet's nginx.conf (Oct 2026), installed as
# /etc/nginx/conf.d/10-ultralove-http.conf so the distro's nginx.conf stays untouched. (ssl_protocols isn't
# carried over: the 24.04 droplet still allowed TLS 1.0/1.1; the distro default, TLS 1.2/1.3, is kept.)

keepalive_timeout 15;
keepalive_requests 1000;
send_timeout 300;
reset_timedout_connection on;
client_max_body_size 100M;

# `gzip on` is in the distro nginx.conf.
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_buffers 16 8k;
gzip_http_version 1.1;
gzip_min_length 256;
gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript application/vnd.ms-fontobject application/wasm font/ttf font/otf image/svg+xml;
