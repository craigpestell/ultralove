server {
    server_name ultralove.ca www.ultralove.ca;
    root /var/www/html;
    index index.php index.html;

    # Never serve repo docs, DB dumps, backups, scripts or deploy metadata from the webroot.
    location ^~ /documentation/ {
        deny all;
    }

    location ~* (\.sql|\.sql\.gz|\.md|\.log|\.sh|\.bak[^/]*|\.orig|\.swp)$ {
        deny all;
    }

    location / {
        limit_req zone=wc_ajax_hot_perip burst=8 nodelay;
        limit_req zone=wishlist_hot_perip burst=4 nodelay;
        try_files $uri $uri/ /index.php?$args;
    }

    location = /wp-json/cloudinary/v1/queue {
        limit_req zone=cloudinary_queue_perip burst=5 nodelay;
        try_files $uri $uri/ /index.php?$args;
    }

    # Ensure auth-related PHP endpoints are always treated as private responses.
    # Match wp-login.php and wp-admin PHP files with full fastcgi handling.
    location ~* ^/(wp-login\.php|wp-admin/.*\.php)$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_param HTTPS on;
        fastcgi_read_timeout 300;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Never cache auth/account pages at edge or intermediary caches (non-PHP routes).
    location ~* ^/(wp-admin/|my-account(/.*)?|cart(/.*)?|checkout(/.*)?)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /index.php?$args;
    }

    # Long-lived caching for static assets (images, fonts, css/js not covered above).
    location ~* \.(?:css|js|mjs|jpg|jpeg|png|gif|webp|avif|svg|ico|woff|woff2|ttf|otf|eot)$ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_param HTTPS on;
        fastcgi_read_timeout 300;
    }

    location ~ /\. {
        deny all;
    }

    listen 443 ssl;
    http2 on;
    # Cloudflare Origin CA certificate (expires 2041-09-21), as on the production droplet. Not in the repo: copy
    # /etc/ssl/cloudflare/ultralove.ca.{pem,key} from the current droplet (see ops/do-migration/README.md).
    ssl_certificate /etc/ssl/cloudflare/ultralove.ca.pem;
    ssl_certificate_key /etc/ssl/cloudflare/ultralove.ca.key;


}
server {
    if ($host = www.ultralove.ca) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = ultralove.ca) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name ultralove.ca www.ultralove.ca;
    return 404; # managed by Certbot




}