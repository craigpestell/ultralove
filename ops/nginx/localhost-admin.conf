# PHP-FPM status page, on 127.0.0.1 only (curl http://127.0.0.1/fpm-status). From the production droplet
# (sites-available/localhost-admin.conf), with the PHP 8.5 socket.
server {
    listen 127.0.0.1:80;
    server_name _;

    location = /fpm-status {
        access_log off;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /status;
        fastcgi_param SCRIPT_NAME /status;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
    }

    location / {
        return 404;
    }
}
