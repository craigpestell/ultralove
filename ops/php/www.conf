; Production PHP-FPM pool, installed by ops/do-migration/bootstrap-app-server.sh as
; /etc/php/8.5/fpm/pool.d/www.conf.
;
; Sized for the s-4vcpu-8gb replacement droplet (the 8.3 droplet had 16 GB and max_children = 40). Measured
; there (Oct 2026): workers use ~160 MB each (max ~190 MB, shared OPcache included), at most 10 were busy at
; once (Baiduspider crawl included) and max_children was never reached. 24 x ~190 MB = ~4.5 GB worst case,
; leaving room for Redis (1 GB cap), OPcache (512 MB), nginx and the OS on 8 GB.

[www]
user = www-data
group = www-data
listen = /run/php/php8.5-fpm.sock
listen.owner = www-data
listen.group = www-data

pm = dynamic
pm.max_children = 24
pm.start_servers = 6
pm.min_spare_servers = 4
pm.max_spare_servers = 10
pm.process_idle_timeout = 5s
; Recycle each worker after 500 requests, so slow memory growth can't add up on the smaller droplet.
pm.max_requests = 500

; Status page (served on 127.0.0.1 only: ops/nginx/localhost-admin.conf, /fpm-status).
pm.status_path = /status

slowlog = /var/log/php8.5-fpm.www-slow.log
request_slowlog_timeout = 5s
request_terminate_timeout = 45s
