; Production PHP settings (PHP-FPM), installed by ops/do-migration/bootstrap-app-server.sh as
; /etc/php/8.5/fpm/conf.d/99-ultralove-production.ini.
;
; Carried over from the PHP 8.3 droplet (its php.ini edits and 99-performance-opcache.ini, Oct 2026), except
; opcache.huge_code_pages and opcache.file_cache, which did nothing there (no huge pages reserved; the
; /tmp/opcache directory didn't exist).

memory_limit = 384M
max_execution_time = 300
max_input_time = 300
max_input_vars = 3000
post_max_size = 100M
upload_max_filesize = 100M
expose_php = Off

; OPcache is part of PHP itself since 8.5; these are the production sizes. validate_timestamps = 0: code only
; changes through deploy/deploy.sh, which restarts PHP-FPM.
opcache.enable = 1
opcache.memory_consumption = 512
opcache.interned_strings_buffer = 64
opcache.max_accelerated_files = 100000
opcache.validate_timestamps = 0

; Path-resolution cache: WordPress stats thousands of files per request. Safe to hold long because code only
; changes through deploy/deploy.sh, which restarts PHP-FPM.
realpath_cache_size = 4M
realpath_cache_ttl = 600

; Tracing JIT; WordPress is mostly I/O-bound, so expect a modest gain. Compare catalog-page timings against the
; same page with opcache.jit = disable before keeping it.
opcache.jit = tracing
opcache.jit_buffer_size = 64M
