name: Critical CSS

# Regenerates wp-content/themes/martfury-child/css/critical.css from dev (see ops/critical-css/README.md)
# after every deploy of main to dev, weekly (for CSS that changes outside git: plugin updates, Customizer),
# and by hand from the Actions tab. When the file changes it opens (or updates) a PR; merging it deploys the
# new critical CSS to dev like any other change, and prod with the next prod deploy.
on:
  workflow_run:
    workflows: [Deploy to dev]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '17 7 * * 1'   # Mondays 07:17 UTC
  workflow_dispatch:

concurrency:
  group: critical-css
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    environment: dev   # holds DEV_SSH_KEY, DEV_SSH_KNOWN_HOSTS, DEV_HOST
    env:
      BRANCH: auto/critical-css
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ops/critical-css/package-lock.json

      - name: Configure SSH to dev
        env:
          DEV_SSH_KEY: ${{ secrets.DEV_SSH_KEY }}
          DEV_SSH_KNOWN_HOSTS: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}
          DEV_HOST: ${{ secrets.DEV_HOST }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEV_SSH_KEY" > ~/.ssh/dev_deploy && chmod 600 ~/.ssh/dev_deploy
          printf '%s\n' "$DEV_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host ultralove-dev-app\n  HostName %s\n  User root\n  IdentityFile ~/.ssh/dev_deploy\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n' "$DEV_HOST" > ~/.ssh/config
          ssh ultralove-dev-app true

      - name: Generate and verify
        working-directory: ops/critical-css
        env:
          CHROME: /usr/bin/google-chrome
        run: |
          npm ci --no-audit --no-fund
          node generate.mjs

      - name: Keep the renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: critical-css-work
          path: ops/critical-css/work/
          if-no-files-found: ignore

      - name: Open or update the PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILE=wp-content/themes/martfury-child/css/critical.css
          if git diff --quiet -- "$FILE" && ! git ls-files --others --exclude-standard -- "$FILE" | grep -q .; then
            echo "critical.css unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add "$FILE"
          git commit -m "Regenerate critical CSS from dev" -m "Generated by the Critical CSS workflow (run ${{ github.run_id }}); every page's first screen matched the full CSS within the verify threshold."
          # A bot-owned branch: it always holds just the latest regeneration on top of main.
          git push --force origin "$BRANCH"
          {
            echo "Regenerated \`$FILE\` from dev by the [Critical CSS workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
            echo
            echo "First-screen difference, critical CSS only vs full CSS (worst first):"
            echo '```'
            head -n 15 ops/critical-css/work/verify.txt
            echo '```'
            echo
            echo "Before merging, run \`ops/dev/parity.sh\` from a trusted machine (CI has no production access): critical CSS built from a dev whose plugins or theme differ from production's can miss rules production needs."
          } > "$RUNNER_TEMP/body.md"
          if gh pr view "$BRANCH" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$BRANCH" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --base main --head "$BRANCH" --title "Regenerate critical CSS" --body-file "$RUNNER_TEMP/body.md"
          fi
