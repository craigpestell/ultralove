name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.5 (matches production)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: none

      - name: PHP lint
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            php -l "$f" >/dev/null || fail=1
          done < <(git ls-files -z -- 'wp-content/*.php')
          exit $fail

      - name: Shellcheck deploy scripts
        run: shellcheck -x -S warning deploy/*.sh

      - name: Product CSV regression tests
        run: |
          php -l ops/product-export/verify.php
          php ops/product-export/test.php

      - name: Product feed and import title regression tests
        run: |
          php -l ops/dropshipping/verify-retail-names.php
          php ops/dropshipping/test-product-feed.php
          php ops/dropshipping/test-catalog-import.php

      - name: Hosted image migration and delivery regression tests
        run: |
          php ops/product-images/test.php
          php ops/product-images/test-gallery-navigation.php

      - name: Wishlist card regression tests
        run: php ops/wishlist/test.php

      - name: Retailer notes parser regression tests
        run: |
          php ops/retailer-notes/test-parser.php
          php ops/retailer-notes/test-runtime.php
          php ops/retailer-notes/test-terms.php
          node ops/retailer-notes/test-admin-terms.js
          php ops/retailer-notes/test-descriptions.php
          php ops/retailer-notes/test-notes.php
          php ops/retailer-notes/test-normalize-notes.php
          php ops/retailer-notes/test-current-name-slugs.php
          php ops/retailer-notes/test-repairs.php
          php -l ops/retailer-notes/repair-products.php
          php -l ops/retailer-notes/clean-descriptions.php
          php -l ops/retailer-notes/normalize-notes.php
          php -l ops/retailer-notes/current-name-slugs.php

      - name: No DB dumps, invoices, archives, backups or oversized files
        run: |
          bad=$(git ls-files | grep -Ei '\.(sql|sql\.gz|zip|tgz|tar|bak|xlsx)$|\.bak-|(^|/)invoice|(^|/)statement-' || true)
          big=$(git ls-files -z | xargs -0 -I{} sh -c 'test $(wc -c < "{}") -gt 5000000 && echo "{}"' || true)
          if [ -n "$bad$big" ]; then
            echo "::error::Forbidden or oversized files tracked:"; printf '%s\n' $bad $big; exit 1
          fi
